name: Shared Wayland protocols

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: denialwm/denial
          ref: dev
          path: .work/shared-denial
          persist-credentials: false
      - name: Compare all shared protocol XMLs byte for byte
        env:
          DROIDLOOM_DENIAL_SOURCE: ${{ github.workspace }}/.work/shared-denial
        run: cargo test --locked -j 1 -p droidloom-contracts --test repository_contracts shared_wayland_protocols_match_denial
