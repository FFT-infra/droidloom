# The ordinary Wayland presenter derives its endpoint from XDG_RUNTIME_DIR so
# the package works for any host user without a machine-specific path.
# Development runtime: Composer has a dynamic host PID and AID_SYSTEM identity.
DROIDLOOM_HOST_PEER_PID=0
DROIDLOOM_HOST_PEER_UID=1000
DROIDLOOM_HOST_PEER_GID=1000
DROIDLOOM_RENDER_NODE=/dev/dri/renderD128
