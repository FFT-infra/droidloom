[package]
name = "droidloom-frame-timing"
default-run = "droidloom-frame-timing"
description = "Report sampled frame-stage timings and DRM GPU client accounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "droidloom-frame-timing"
path = "src/main.rs"

[[bin]]
name = "droidloom-gpu-usage"
path = "src/bin/droidloom-gpu-usage.rs"
